name: SBI Library CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test-windows:
    name: Build and Test on Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install conan
        
    - name: Configure Conan profile
      run: |
        conan profile detect --force
        
    - name: Install dependencies
      run: |
        conan install . --output-folder=build --build=missing
        
    - name: Configure CMake
      run: |
        cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="build/build/generators/conan_toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
        
    - name: Build CLib library
      run: |
        cmake --build build --config Release --target sbi_clib
        
    - name: Build unit tests
      run: |
        cmake --build build --config Release --target configura_test entorno_test
        
    - name: Run unit tests
      run: |
        cd build/CLib/tests
        ctest --output-on-failure -C Release
      continue-on-error: true
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: build/CLib/tests/Testing/
        
  build-and-test-linux:
    name: Build and Test on Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
